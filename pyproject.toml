[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "research-machine"
dynamic = ["version"]
description = "A headless, provenance-first engine for turning curiosity into testable inquiries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.23"]
notebook = ["jupyter-client>=8.6", "nbclient>=0.10", "nbformat>=5.10"]

[project.scripts]
research = "research_machine.interfaces.cli:main"
research-notebook = "research_machine.executors.protected_notebook:main"
research-notebook-preflight = "research_machine.executors.notebook_preflight:main"
research-notebook-runtime-preflight = "research_machine.executors.runtime_preflight:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "research_machine.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
