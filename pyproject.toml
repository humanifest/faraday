[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "research-machine"
version = "0.1.0"
description = "A headless, provenance-first engine for turning curiosity into testable inquiries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
research = "research_machine.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
